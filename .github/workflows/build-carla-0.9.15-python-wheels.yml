name: build-carla-0.9.15-python-wheels

on:
  workflow_dispatch:
    inputs:
      python_versions:
        description: 'JSON array of CPython versions, for example ["3.9","3.10"]'
        required: true
        type: string
        default: '["3.9","3.10","3.11","3.12","3.13","3.14"]'
      publish_release:
        description: "Publish the wheels to a GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "GitHub Release tag used when publishing"
        required: true
        type: string
        default: "carla-python-api-0.9.15"

concurrency:
  group: carla-0.9.15-python-wheels-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARLA_VERSION: "0.9.15"
  CARLA_WHEEL_PLATFORM: "manylinux_2_31_x86_64"

jobs:
  build:
    name: Build all Python wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      # Debian 11 provides the glibc 2.31 ABI baseline. One container builds
      # shared dependencies and every requested Python wheel.
      image: debian:bullseye-slim
      options: --user root
    env:
      CARLA_BUILD_CONCURRENCY: "2"
      CARLA_PYTHON_VERSIONS_JSON: ${{ inputs.python_versions }}
      CARLA_RECLAIM_APT_SPACE: "1"
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
      UV_CACHE_DIR: ${{ github.workspace }}/build-carla/.work/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build-carla/.work/python

    steps:
      - name: Check out build scripts
        uses: actions/checkout@v4

      - name: Show initial disk space
        shell: bash
        run: df -h

      - name: Install system build dependencies
        shell: bash
        run: ./build-carla/install-dependencies-debian.sh

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Prepare all CPython runtimes
        shell: bash
        run: ./build-carla/prepare-python.sh

      - name: Fetch and patch official CARLA source
        shell: bash
        run: ./build-carla/fetch-source.sh

      - name: Build LibCarla client and all raw wheels
        shell: bash
        run: ./build-carla/build-wheels.sh

      - name: Repair and import-test manylinux wheels
        shell: bash
        run: ./build-carla/repair-wheels.sh

      - name: Write build metadata
        shell: bash
        run: ./build-carla/write-metadata.sh

      - name: Reclaim intermediate build space
        shell: bash
        run: |
          ./build-carla/clean.sh --work
          df -h

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: carla-${{ env.CARLA_VERSION }}-python-wheels-${{ env.CARLA_WHEEL_PLATFORM }}
          path: build-carla/dist/wheels/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: carla-${{ env.CARLA_VERSION }}-python-wheels-${{ env.CARLA_WHEEL_PLATFORM }}
          path: dist

      - name: List release files
        shell: bash
        run: find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: CARLA ${{ env.CARLA_VERSION }} Python wheels
          body: |
            Client-only CARLA ${{ env.CARLA_VERSION }} wheels built on the
            glibc 2.31 ABI baseline.

            The build uses CARLA's original `setup -> BuildLibCarla client ->
            BuildOSM2ODR -> BuildPythonAPI` BuildTools chain. GitHub Actions
            invokes the same auditable scripts available in `build-carla/` for
            local reproduction. Build manifests and SHA-256 checksums are
            attached.
          files: |
            dist/*.whl
            dist/build-manifest-*.json
            dist/SHA256SUMS
            dist/LICENSE-CARLA.txt
          fail_on_unmatched_files: true
