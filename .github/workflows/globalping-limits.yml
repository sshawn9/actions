name: globalping-limits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print runner public IPv4
        shell: bash
        run: |
          public_ip=$(curl -4 --fail --silent --show-error --max-time 30 https://api.ipify.org)
          printf 'Runner public IPv4: %s\n' "$public_ip"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install latest Globalping CLI
        shell: bash
        run: |
          go install github.com/jsdelivr/globalping-cli@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Query Globalping limits (anonymous)
        shell: bash
        run: |
          globalping-cli version
          globalping-cli limits --ci
